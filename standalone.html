<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Grow AI automates smart buying, selling, and profit-taking decisions to help traders grow faster with confidence.">
    <title>Grow AI | Smart Automated Trading</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #07111f;
            --bg-soft: #0d1a2b;
            --panel: rgba(15, 25, 40, 0.9);
            --panel-strong: #111d2d;
            --line: rgba(148, 163, 184, 0.14);
            --text: #e5f0ff;
            --muted: #9bb0c8;
            --primary: #4be1a9;
            --primary-strong: #2dd4a7;
            --secondary: #7cb7ff;
            --highlight: #88f7d4;
            --card-shadow: 0 24px 60px rgba(7, 17, 31, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top, rgba(76, 129, 255, 0.28), transparent 30%), linear-gradient(180deg, #07111f 0%, #0a1425 100%);
            color: var(--text);
        }

        button {
            font: inherit;
            border: 0;
            cursor: pointer;
        }

        img {
            max-width: 100%;
            display: block;
        }

        #root {
            min-height: 100vh;
        }

        .container {
            width: min(1180px, calc(100% - 40px));
            margin: 0 auto;
        }

        .page-shell {
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 0 18px;
        }

        .brand-wrap {
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .brand-mark {
            display: grid;
            place-items: center;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: #06213a;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(61, 195, 169, 0.45);
        }

        .brand-text {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .nav {
            display: inline-flex;
            align-items: center;
            gap: 28px;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: 0.96rem;
        }

        .nav a:hover {
            color: var(--text);
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .cta-button {
            padding: 0.9rem 1.4rem;
            border-radius: 999px;
            font-weight: 600;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .cta-button:hover {
            transform: translateY(-1px);
        }

        .cta-button.primary {
            background: linear-gradient(135deg, var(--primary), var(--highlight));
            color: #06213a;
            box-shadow: 0 18px 32px rgba(75, 225, 169, 0.26);
        }

        .cta-button.secondary {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            color: var(--text);
        }

        .cta-button.ghost {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--text);
        }

        .cta-button.full {
            width: 100%;
        }

        .hero {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 48px;
            align-items: center;
            padding: 52px 0 32px;
        }

        .eyebrow {
            display: inline-block;
            padding: 0.5rem 0.8rem;
            border-radius: 999px;
            background: rgba(75, 225, 169, 0.12);
            border: 1px solid rgba(75, 225, 169, 0.22);
            color: var(--highlight);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .hero-copy h1 {
            margin: 22px 0 18px;
            font-size: clamp(2.9rem, 6vw, 5rem);
            line-height: 0.96;
            letter-spacing: -0.06em;
        }

        .hero-copy p {
            max-width: 640px;
            margin: 0;
            color: var(--muted);
            font-size: 1.08rem;
            line-height: 1.75;
        }

        .hero-actions {
            display: flex;
            gap: 16px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        .social-proof {
            display: flex;
            gap: 42px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .social-proof div {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .social-proof strong {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .social-proof span {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .hero-visual {
            display: flex;
            justify-content: center;
        }

        .dashboard-card {
            width: min(100%, 480px);
            background: rgba(8, 18, 31, 0.88);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 24px;
            box-shadow: var(--card-shadow);
            animation: slideInUp 0.6s ease-out;
        }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--muted);
            font-weight: 600;
        }

        .live-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(75, 225, 169, 0.12);
            border: 1px solid rgba(75, 225, 169, 0.25);
            color: var(--highlight);
            padding: 0.35rem 0.7rem;
            border-radius: 999px;
            font-size: 0.8rem;
        }

        .live-pill::before {
            content: '';
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 12px rgba(75, 225, 169, 0.8);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .balance-row {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-top: 24px;
        }

        .balance-row small {
            display: block;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .balance-row h3 {
            margin: 0;
            font-size: clamp(2rem, 2vw, 2.6rem);
        }

        .profit-tag {
            padding: 0.55rem 0.8rem;
            background: rgba(75, 225, 169, 0.12);
            color: var(--highlight);
            border: 1px solid rgba(75, 225, 169, 0.22);
            border-radius: 999px;
            font-weight: 700;
        }

        .chart-bars {
            height: 152px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            margin: 28px 0 18px;
            padding: 18px 10px 0;
            background: linear-gradient(180deg, rgba(124, 183, 255, 0.08), rgba(124, 183, 255, 0));
            border-radius: 18px;
            border: 1px solid rgba(124, 183, 255, 0.1);
        }

        .chart-bars span {
            flex: 1;
            border-radius: 12px 12px 0 0;
            background: linear-gradient(180deg, #7cb7ff, #4be1a9);
            box-shadow: 0 14px 20px rgba(76, 129, 255, 0.22);
            animation: growUp 0.8s ease-out;
        }

        @keyframes growUp {
            from { height: 0 !important; }
        }

        .portfolio-list {
            display: grid;
            gap: 12px;
        }

        .portfolio-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.025);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 14px;
        }

        .asset-name {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text);
            font-weight: 600;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
        }

        .asset-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .change {
            color: var(--highlight);
            font-weight: 600;
        }

        .metrics-wrap {
            padding: 24px 0 10px;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 18px;
        }

        .metric-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .metric-box strong {
            font-size: clamp(1.5rem, 2vw, 2rem);
        }

        .metric-box span {
            color: var(--muted);
        }

        .section-block {
            padding: 88px 0 32px;
        }

        .section-heading {
            margin-bottom: 34px;
        }

        .section-heading h2 {
            margin: 18px 0 0;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: -0.05em;
        }

        .centered {
            text-align: center;
        }

        .feature-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 20px;
        }

        .feature-card {
            background: rgba(10, 20, 33, 0.8);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 26px 20px;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-4px);
            border-color: rgba(75, 225, 169, 0.4);
        }

        .feature-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 1.4rem;
            background: rgba(124, 183, 255, 0.12);
            border: 1px solid rgba(124, 183, 255, 0.15);
        }

        .feature-card h3 {
            margin: 18px 0 10px;
            font-size: 1.3rem;
        }

        .feature-card p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .dual-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 58px 0 26px;
        }

        .info-panel {
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 36px;
        }

        .info-panel h2 {
            margin: 18px 0 0;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: -0.05em;
        }

        .info-panel p {
            color: var(--muted);
            line-height: 1.8;
            margin-top: 18px;
        }

        .steps-panel {
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 18px 18px 10px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 14px;
            border-bottom: 1px solid var(--line);
        }

        .step-item:last-child {
            border-bottom: none;
        }

        .step-index {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(75, 225, 169, 0.12);
            color: var(--highlight);
            font-weight: 700;
        }

        .step-item p {
            margin: 0;
            color: var(--muted);
            line-height: 1.7;
        }

        .strategy-panel {
            padding: 40px 0 18px;
        }

        .strategy-card {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            padding: 32px 34px;
            gap: 20px;
            align-items: center;
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 28px;
        }

        .strategy-card h2 {
            margin: 18px 0 0;
            font-size: clamp(2rem, 3vw, 3rem);
            letter-spacing: -0.05em;
        }

        .strategy-card ul {
            margin: 0;
            padding-left: 20px;
            color: var(--muted);
            line-height: 2;
        }

        .pricing-section {
            padding: 88px 0 80px;
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            margin-top: 30px;
        }

        .price-card {
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 28px 24px;
        }

        .price-card.featured {
            background: linear-gradient(180deg, rgba(75, 225, 169, 0.08), rgba(11, 19, 30, 0.82));
            border-color: rgba(75, 225, 169, 0.28);
        }

        .plan {
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
            font-weight: 700;
        }

        .price-card h3 {
            margin: 18px 0 18px;
            font-size: 2.7rem;
            letter-spacing: -0.05em;
        }

        .price-card h3 span {
            color: var(--muted);
            font-size: 1rem;
        }

        .price-card ul {
            list-style: none;
            margin: 0 0 22px;
            padding: 0;
            color: var(--muted);
            display: grid;
            gap: 10px;
        }

        .price-card li::before {
            content: '✓';
            color: var(--highlight);
            margin-right: 10px;
            font-weight: 700;
        }

        .dashboard-page {
            padding: 40px 0;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .dashboard-header h2 {
            margin: 8px 0 0;
            font-size: 2.2rem;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .mini-card {
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 20px;
        }

        .mini-card span {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .mini-card strong {
            display: block;
            font-size: 1.8rem;
            margin-top: 8px;
        }

        .mini-card em {
            display: block;
            color: var(--highlight);
            font-size: 0.9rem;
            margin-top: 8px;
            font-style: normal;
        }

        .panel-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .panel-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .pill {
            padding: 0.4rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .pill.neutral {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }

        .pill.success {
            background: rgba(75, 225, 169, 0.2);
            color: var(--highlight);
        }

        .line-chart {
            height: 200px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 20px 0;
        }

        .line-chart span {
            flex: 1;
            border-radius: 8px 8px 0 0;
            background: linear-gradient(180deg, #7cb7ff, #4be1a9);
        }

        .signal-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: grid;
            gap: 12px;
        }

        .signal-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
        }

        .signal-list span {
            color: var(--muted);
        }

        .signal-list strong {
            color: var(--highlight);
        }

        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .activity-list {
            display: grid;
            gap: 12px;
        }

        .activity-item {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            align-items: center;
        }

        .activity-item strong {
            display: block;
            font-size: 0.9rem;
        }

        .activity-item span {
            display: block;
            color: var(--muted);
            font-size: 0.8rem;
        }

        .activity-item small {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .health-stack {
            display: grid;
            gap: 16px;
        }

        .health-stack > div {
            display: grid;
            gap: 6px;
        }

        .health-stack label {
            color: var(--muted);
            font-size: 0.85rem;
        }

        .progress {
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #4be1a9, #88f7d4);
            border-radius: 999px;
        }

        .auth-page {
            display: grid;
            place-items: center;
            min-height: 85vh;
            padding: 40px 0;
        }

        .auth-card {
            width: min(100%, 420px);
            background: rgba(11, 19, 30, 0.82);
            border: 1px solid var(--line);
            border-radius: 28px;
            padding: 40px;
        }

        .auth-copy {
            margin-bottom: 32px;
        }

        .auth-copy h2 {
            margin: 12px 0 0;
            font-size: 2rem;
        }

        .auth-copy p {
            color: var(--muted);
            margin-top: 8px;
            line-height: 1.6;
        }

        .auth-form {
            display: grid;
            gap: 18px;
        }

        .auth-form label {
            display: block;
            color: var(--text);
            font-weight: 500;
            font-size: 0.9rem;
        }

        .auth-form input {
            width: 100%;
            margin-top: 6px;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
        }

        .auth-form input:focus {
            outline: none;
            border-color: rgba(75, 225, 169, 0.4);
            background: rgba(75, 225, 169, 0.05);
        }

        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-weight: 400;
        }

        .checkbox-row input {
            width: auto;
            margin: 0;
        }

        .form-row a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .form-row a:hover {
            text-decoration: underline;
        }

        .footer {
            border-top: 1px solid var(--line);
            padding: 20px 0 40px;
        }

        .footer-inner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            flex-wrap: wrap;
        }

        .footer p {
            margin: 0;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .hero, .dual-section, .strategy-card, .feature-grid, .pricing-grid, .metrics-grid, .dashboard-grid, .panel-grid, .bottom-grid {
                grid-template-columns: 1fr;
            }

            .nav {
                display: none;
            }

            .topbar {
                padding-top: 22px;
            }

            .header-actions {
                flex-direction: column;
            }

            .dashboard-card {
                width: 100%;
            }
        }

        @media (max-width: 560px) {
            .hero-copy h1 {
                font-size: 2.8rem;
            }

            .cta-button {
                width: 100%;
            }

            .hero-actions {
                display: grid;
                grid-template-columns: 1fr;
            }

            .topbar {
                justify-content: center;
            }
        }
    </style>
</head>

    <div id="root"></div>
